<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Toy Game Gallery</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ffffff;
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #dddddd;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .product-card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .product-image {
            display: block;
            width: 640px;
            height: 360px;
            max-width: 100%;
            object-fit: contain;
            margin: 20px auto;
            background-color: #eeeeee;
        }

        .description {
            color: #666666;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <header>
        <h1>Toy Game Gallery</h1>
    </header>

    <main>

        <div class="product-card">

            <h2>Featured Game</h2>

            <img
                class="product-image"
                src="./toy.png"
                alt="Featured game image"
            >

            <p class="description">
                Explore our featured game collection.
            </p>

        </div>

    </main>

</body>
</html>
